<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Triagem</title>

    <style>
        .vermelho { color: red; font-weight: bold; }
        .amarelo { color: orange; font-weight: bold; }
        .verde { color: green; font-weight: bold; }
    </style>
</head>

<body>

<div class="container">

    <h2>Triagem</h2>

    <input type="text" placeholder="Nome" id="nome">

    <select id="sintoma">
        <option value="">Selecione o sintoma</option>

        <option value="coriza">Coriza</option>
        <option value="tosse">Tosse</option>
        <option value="febre">Febre</option>
        <option value="vomito">Vômito</option>
        <option value="diarreia">Diarreia</option>
        <option value="falta_ar_moderada">Falta de ar moderada</option>
        <option value="falta_ar_grave">Falta de ar grave</option>
        <option value="infarto">Suspeita de infarto</option>
        <option value="avc">Suspeita de AVC</option>
        <option value="convulsao">Convulsão</option>
        <option value="hemorragia">Hemorragia</option>
    </select>

    <input id="temp" type="number" placeholder="Temperatura">

    <input id="alergia" placeholder="Alergias">

    <textarea id="observacao" placeholder="Observações"></textarea>

    <div id="resultado"></div>

    <button onclick="salvarTriagem()">Salvar Triagem</button>

</div>

<script>

// ==========================
// CLASSIFICAÇÃO DE RISCO
// ==========================
function classificarRisco(sintoma, temperatura) {

    const vermelhos = [
        "infarto",
        "avc",
        "convulsao",
        "hemorragia",
        "falta_ar_grave"
    ];

    const amarelos = [
        "febre",
        "vomito",
        "diarreia",
        "falta_ar_moderada"
    ];

    if (temperatura >= 39) return "vermelho";

    if (vermelhos.includes(sintoma)) return "vermelho";

    if (amarelos.includes(sintoma)) return "amarelo";

    return "verde";
}

// ==========================
// SALVAR TRIAGEM
// ==========================
function salvarTriagem() {

    const nome = document.getElementById("nome").value.trim();
    const sintoma = document.getElementById("sintoma").value;
    const temperatura = Number(document.getElementById("temp").value || 0);
    const alergia = document.getElementById("alergia").value.trim();
    const observacao = document.getElementById("observacao").value.trim();

    if (!nome || !sintoma) {
        alert("Preencha nome e sintoma");
        return;
    }

    const risco = classificarRisco(sintoma, temperatura);

    fetch("http://localhost:3000/triagem", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            nome,
            sintoma,
            temperatura,
            alergia,
            observacao,
            risco
        })
    })
    .then(async r => {
        const data = await r.json().catch(() => null);
        if (!r.ok) throw new Error("Erro ao salvar");
        return data;
    })
    .then(() => {

        const resultado = document.getElementById("resultado");

        resultado.className = risco;
        resultado.innerHTML = "Classificação: " + risco.toUpperCase();

        alert("Triagem salva com sucesso!");

        // limpar formulário
        document.getElementById("nome").value = "";
        document.getElementById("sintoma").value = "";
        document.getElementById("temp").value = "";
